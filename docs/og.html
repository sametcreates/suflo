<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>og</title>
<style>
  /* Link onizleme karti — 1200x630 (WhatsApp, Telegram, X, LinkedIn, Facebook) */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(700px 500px at 22% 20%, rgba(139,124,246,.28), transparent 62%),
      radial-gradient(600px 500px at 88% 88%, rgba(91,140,255,.20), transparent 62%),
      #0b0c12;
    font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
    color: #eceaf6;
    display: flex; align-items: center;
    padding: 0 72px; box-sizing: border-box;
    position: relative;
  }
  .sol { width: 690px; }
  .marka { display: flex; align-items: center; gap: 16px; margin-bottom: 34px; }
  .marka svg { width: 58px; height: 58px; }
  .marka span {
    font-size: 34px; font-weight: 700; letter-spacing: -.3px;
    background: linear-gradient(135deg, #8b7cf6, #5b8cff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 {
    font-size: 60px; line-height: 1.08; letter-spacing: -1.4px;
    margin: 0 0 22px; font-weight: 700;
  }
  h1 em {
    font-style: normal;
    background: linear-gradient(135deg, #8b7cf6, #5b8cff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { font-size: 25px; color: #9b9db4; margin: 0 0 30px; }
  .rozetler { display: flex; gap: 11px; }
  .rozet {
    font-size: 18px; padding: 10px 20px; border-radius: 999px;
    border: 1px solid #2b3048; background: rgba(255,255,255,.035); color: #cfc9ff;
  }
  .adres {
    position: absolute; left: 72px; bottom: 44px;
    font-size: 22px; color: #6f7290; letter-spacing: .3px;
  }
  /* sag tarafta panel gorseli */
  .sag {
    position: absolute; right: -40px; top: 50%; transform: translateY(-50%) rotate(-6deg);
    width: 360px; height: 700px; border-radius: 26px; overflow: hidden;
    box-shadow: 0 50px 120px rgba(0,0,0,.7), 0 0 0 1px rgba(139,124,246,.3);
  }
  .sag img { width: 100%; display: block; }
</style>
</head>
<body>
  <div class="sol">
    <div class="marka">
      <svg viewBox="0 0 20 20">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7cf6"/><stop offset="1" stop-color="#5b8cff"/></linearGradient></defs>
        <rect x="1" y="1" width="18" height="18" rx="5" fill="url(#g)"/>
        <path d="M13.9 7.2 C13.5 5.5 11.9 4.7 10 4.7 C8 4.7 6.3 5.5 6.3 7.1 C6.3 10.7 13.7 9.1 13.7 12.9 C13.7 14.5 12 15.3 10 15.3 C8.1 15.3 6.5 14.5 6.1 12.8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <span>Suflo</span>
    </div>
    <h1>Premiere'e <em>Türkçe altyazı.</em></h1>
    <p>Adobe'un yapamadığını yapan ücretsiz eklenti.</p>
    <div class="rozetler">
      <div class="rozet">Ücretsiz</div>
      <div class="rozet">Sınırsız</div>
      <div class="rozet">İnternetsiz çalışır</div>
    </div>
    <div class="adres">suflo.app</div>
  </div>
  <div class="sag"><img src="panel-og.png" alt=""></div>
</body>
</html>
